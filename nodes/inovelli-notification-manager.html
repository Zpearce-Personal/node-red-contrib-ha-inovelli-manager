<script type="text/javascript">
  (function () {
    // Kept in sync with nodes/lib/devices.js — editor cannot require() it.
    const MODELS = {
      zwave_js: [
        ["vzw31-sn", "VZW31-SN 2-1 (Red)"], ["vzw32-sn", "VZW32-SN mmWave 2-1 (Red)"],
        ["lzw30-sn", "LZW30-SN On/Off (Red)"], ["lzw31-sn", "LZW31-SN Dimmer (Red)"],
        ["lzw36", "LZW36 Fan + Light (Red)"],
      ],
      zigbee2mqtt: [
        ["vzm31-sn", "VZM31-SN 2-1 (Blue)"], ["vzm32-sn", "VZM32-SN mmWave 2-1 (Blue)"],
        ["vzm35-sn", "VZM35-SN Fan Switch (Blue)"],
      ],
      zha: [
        ["vzm31-sn", "VZM31-SN 2-1 (Blue)"], ["vzm32-sn", "VZM32-SN mmWave 2-1 (Blue)"],
        ["vzm35-sn", "VZM35-SN Fan Switch (Blue)"],
      ],
      matter: [
        ["vtm31-sn", "VTM31-SN 2-1 (White)"], ["vtm35-sn", "VTM35-SN Fan Switch (White)"],
      ],
    };
    const EFFECTS_21_ALL = ["off", "solid", "fast_blink", "slow_blink", "pulse", "chase",
      "open_close", "small_to_big", "aurora", "slow_falling", "medium_falling", "fast_falling",
      "slow_rising", "medium_rising", "fast_rising", "medium_blink", "slow_chase", "fast_chase",
      "fast_siren", "slow_siren"];
    const EFFECTS_21_INDIVIDUAL = ["off", "solid", "fast_blink", "slow_blink", "pulse", "chase",
      "falling", "rising", "aurora"];
    const EFFECTS_LZW_SWITCH = ["off", "solid", "fast_blink", "slow_blink", "pulse"];
    const EFFECTS_LZW_DIMMER = ["off", "solid", "chase", "fast_blink", "slow_blink", "pulse"];
    const EFFECTS_MATTER = ["Solid", "Blink", "Chase", "Siren"]; // free-text; device-defined options

    function effectsFor(model, led) {
      if (model.startsWith("vtm")) return EFFECTS_MATTER;
      if (model.startsWith("lzw")) return model === "lzw30-sn" ? EFFECTS_LZW_SWITCH : EFFECTS_LZW_DIMMER;
      return led === "all" ? EFFECTS_21_ALL : EFFECTS_21_INDIVIDUAL;
    }
    function pretty(name) {
      return name.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    RED.nodes.registerType("inovelli-notification-manager", {
      category: "inovelli",
      color: "#B68181",
      defaults: {
        name: { value: "" },
        integration: { value: "zwave_js" },
        model: { value: "vzw31-sn" },
        entityid: { value: "" },
        basetopic: { value: "zigbee2mqtt" },
        devicename: { value: "" },
        ieee: { value: "" },
        matterlight: { value: "" },
        mattereffect: { value: "" },
        mattercolor: { value: "" },
        color: { value: 0 },
        level: { value: 100 },
        duration: { value: 255 },
        effect: { value: "pulse" },
        led: { value: "all" },
        clear: { value: false },
        multicast: { value: false },
      },
      inputs: 1,
      outputs: 1,
      outputLabels: "Connect to a Home Assistant action node",
      icon: "light.svg",
      align: "right",
      label: function () { return this.name || "inovelli-notification-manager"; },
      oneditprepare: function () {
        const self = this;

        function refreshModels() {
          const integration = $("#node-input-integration").val();
          const $model = $("#node-input-model").empty();
          MODELS[integration].forEach(([id, label]) => $model.append(new Option(label, id)));
          $model.val(MODELS[integration].some(([id]) => id === self.model) ? self.model : MODELS[integration][0][0]);
          refreshVisibility();
          refreshEffects();
        }
        function refreshVisibility() {
          const integration = $("#node-input-integration").val();
          $(".row-zwave").toggle(integration === "zwave_js");
          $(".row-z2m").toggle(integration === "zigbee2mqtt");
          $(".row-zha").toggle(integration === "zha");
          $(".row-matter").toggle(integration === "matter");
          $(".row-led").toggle(integration !== "matter" && !$("#node-input-model").val().startsWith("lzw"));
        }
        function refreshEffects() {
          const model = $("#node-input-model").val();
          const led = $("#node-input-led").val() || "all";
          const $effect = $("#node-input-effect");
          const previous = $effect.val() || self.effect;
          $effect.empty();
          effectsFor(model, led).forEach((e) => $effect.append(new Option(pretty(e), e)));
          if ($effect.find(`option[value="${previous}"]`).length) $effect.val(previous);
          const max = model.startsWith("lzw") ? 10 : 100;
          $("#node-input-level").attr("max", max);
          $("#levelOutput").text($("#node-input-level").val());
        }

        $("#node-input-integration").on("change", refreshModels);
        $("#node-input-model").on("change", function () { refreshVisibility(); refreshEffects(); });
        $("#node-input-led").on("change", refreshEffects);
        $("#node-input-color").on("input change", function () { $("#colorOutput").text(this.value); });
        $("#node-input-level").on("input change", function () { $("#levelOutput").text(this.value); });
        $("#node-input-clear").on("change", function () {
          $(".row-notify").toggle(!$(this).is(":checked"));
        });
        refreshModels();
      },
    });
  })();
</script>

<script type="text/x-red" data-help-name="inovelli-notification-manager">
    <p>This node constructs the message for controlling LED bar notifications on an Inovelli Red (Z-Wave), Blue (Zigbee), or White (Matter) series switch. The output should be connected directly to a Home Assistant action node (<code>msg.payload = { action, target?, data }</code>).</p>
    <dl class="message-properties">
        <dt>Integration<span class="property-type">string</span></dt>
        <dd>Which Home Assistant integration controls the device: <code>zwave_js</code>, <code>zigbee2mqtt</code>, <code>zha</code>, or <code>matter</code>. Determines which of the fields below are shown/used.</dd>

        <dt>Model<span class="property-type">string</span></dt>
        <dd>The Inovelli switch model. The list is filtered to models supported by the selected Integration.</dd>

        <dt>Entity ID(s)<span class="property-type">string</span></dt>
        <dd>(Z-Wave JS only) Entity ID, or a comma-delimited list of entity IDs, to target.</dd>

        <dt>Use Multicast<span class="property-type">boolean</span></dt>
        <dd>(Z-Wave JS only) Check this box to send the notification via Z-Wave multicast when targeting multiple devices.</dd>

        <dt>Base Topic<span class="property-type">string</span></dt>
        <dd>(Zigbee2MQTT only) The MQTT base topic configured for your Zigbee2MQTT bridge (default <code>zigbee2mqtt</code>).</dd>

        <dt>Device Name<span class="property-type">string</span></dt>
        <dd>(Zigbee2MQTT only) The friendly name of the device as known to Zigbee2MQTT.</dd>

        <dt>IEEE Address<span class="property-type">string</span></dt>
        <dd>(ZHA only) The IEEE address of the device to target.</dd>

        <dt>LED Light Entity<span class="property-type">string</span></dt>
        <dd>(Matter only) The <code>light</code> entity that represents the switch's LED bar.</dd>

        <dt>LED Effect Select Entity<span class="property-type">string</span></dt>
        <dd>(Matter only) The <code>select</code> entity used to choose the LED effect.</dd>

        <dt>LED Color Select Entity<span class="property-type">string</span></dt>
        <dd>(Matter only) The <code>select</code> entity used to choose the LED color.</dd>

        <dt>LED<span class="property-type">string</span></dt>
        <dd>Which LED segment to target: All, or an individual LED 1 (bottom) through 7 (top). Not shown for Matter or legacy LZW models, which only support a single LED bar.</dd>

        <dt>Color<span class="property-type">number|string|array</span></dt>
        <dd>Color to display (accepts color names, RGB arrays, hex, and 0-360&deg; hue values; 361=white).</dd>

        <dt>Level<span class="property-type">number</span></dt>
        <dd>Brightness level of the LED notification. 0-100 for VZW/VZM/VTM models, 0-10 for legacy LZW models.</dd>

        <dt>Duration<span class="property-type">number|string</span></dt>
        <dd>How long to display the notification before it clears automatically.</dd>

        <dt>Effect<span class="property-type">string</span></dt>
        <dd>The notification effect to play. Options are filtered by Model and LED selection.</dd>

        <dt>Clear Notification<span class="property-type">boolean</span></dt>
        <dd>Check this box, or set <code>msg.payload.clear</code> to <code>true</code>, to clear the current LED notification instead of setting a new one.</dd>
    </dl>
    <p>
      Any value configured on this node can be overridden per-message by setting the matching key on <code>msg.payload</code>. Recognized override keys: <code>integration</code> (alias <code>zwave</code>), <code>model</code> (alias <code>switchtype</code>), <code>entity_id</code>, <code>topic</code>, <code>device</code>, <code>ieee</code>, <code>light_entity</code>, <code>effect_entity</code>, <code>color_entity</code>, <code>color</code>, <code>level</code> (alias <code>brightness</code>), <code>duration</code>, <code>effect</code>, <code>led</code>, <code>clear</code>, <code>multicast</code>. For example:
      <pre>
msg = {
  payload: {
    integration: "zwave_js",
    entity_id: "light.bedroom",
    color: "red",
    duration: "30 seconds",
    effect: "slow_blink",
    level: 100
  }
}

or

msg = {
  payload: {
    integration: "zigbee2mqtt",
    topic: "zigbee2mqtt",
    device: "Bedroom Switch",
    color: 240,
    duration: 255,
    effect: "aurora",
    level: 100
  }
}
      </pre>
    </p>
