<script type="text/javascript">
RED.nodes.registerType('inovelli-notification-manager', {
  category: 'home assistant', color: '#c6dbef', defaults: {
    name: { value: '' }, zwave: { value: 'zwave_js' }, entity_id: { value: '' }, node_id: { value: '' }, switchtype: { value: 'lzw31-sn' }, color: { value: '0' }, brightness: { value: '10' }, duration: { value: '5 seconds' }, effect: { value: 'solid' }, clear: { value: false }, multicast: { value: false }
  }, inputs: 1, outputs: 1, icon: 'font-awesome/fa-bell', label: function () { return this.name || 'Inovelli Notification'; }, paletteLabel: 'Inovelli notification',
  oneditprepare: function () {
    $('#node-input-clear').prop('checked', !!this.clear);
    $('#node-input-multicast').prop('checked', !!this.multicast);
  }
});
</script>
<script type="text/html" data-template-name="inovelli-notification-manager">
<div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
<div class="form-row"><label for="node-input-zwave">Integration</label><select id="node-input-zwave"><option value="zwave_js">Z-Wave JS</option><option value="ozw">OpenZWave</option><option value="zwave">Z-Wave (deprecated)</option></select></div>
<div class="form-row"><label for="node-input-entity_id">Entity IDs</label><input type="text" id="node-input-entity_id" placeholder="light.inovelli"></div>
<div class="form-row"><label for="node-input-node_id">Node IDs</label><input type="text" id="node-input-node_id"></div>
<div class="form-row"><label for="node-input-switchtype">Switch type</label><input type="text" id="node-input-switchtype" placeholder="lzw31-sn"></div>
<div class="form-row"><label for="node-input-color">Color (hue 0–361)</label><input type="text" id="node-input-color"></div>
<div class="form-row"><label for="node-input-brightness">Brightness (0–10)</label><input type="number" id="node-input-brightness" min="0" max="10"></div>
<div class="form-row"><label for="node-input-duration">Duration</label><input type="text" id="node-input-duration" placeholder="5 seconds"></div>
<div class="form-row"><label for="node-input-effect">Effect</label><select id="node-input-effect"><option>off</option><option>solid</option><option>chase</option><option>fast blink</option><option>slow blink</option><option>pulse</option></select></div>
<div class="form-row"><label for="node-input-clear">Clear notification</label><input type="checkbox" id="node-input-clear" style="width:auto"></div>
<div class="form-row"><label for="node-input-multicast">Use Z-Wave JS multicast</label><input type="checkbox" id="node-input-multicast" style="width:auto"></div>
</script>
<script type="text/html" data-help-name="inovelli-notification-manager">
<p>Builds service-call messages for Inovelli notification parameters. Connect to a Home Assistant api-call-service node. One message is emitted per parameter.</p>
<p>Configure integration, entity or node IDs, model, hue, brightness (0–10), duration (1–255 minutes encoded from seconds/minutes/hours/days), effect, clear, and optional Z-Wave JS multicast.</p>
<p>Incoming payload overrides: <code>zwave</code>, <code>entity_id</code>, <code>node_id</code>, <code>switchtype</code>, <code>color</code>, <code>brightness</code>, <code>duration</code>, <code>effect</code>, <code>clear</code>, <code>multicast</code>. Color accepts hue, RGB array, CSS color name, or hex. Z-Wave JS uses entity IDs; OpenZWave and legacy Z-Wave use node IDs.</p>
</script>
