<script type="text/javascript">
  (function () {
    // Kept in sync with nodes/lib/devices.js — editor cannot require() it.
    const MODELS = {
      zwave_js: [
        ["vzw31-sn", "VZW31-SN 2-1 (Red)"], ["vzw32-sn", "VZW32-SN mmWave 2-1 (Red)"],
        ["lzw30-sn", "LZW30-SN On/Off (Red)"], ["lzw31-sn", "LZW31-SN Dimmer (Red)"],
        ["lzw36", "LZW36 Fan + Light (Red)"],
      ],
      zigbee2mqtt: [
        ["vzm31-sn", "VZM31-SN 2-1 (Blue)"], ["vzm32-sn", "VZM32-SN mmWave 2-1 (Blue)"],
        ["vzm35-sn", "VZM35-SN Fan Switch (Blue)"], ["vzm36", "VZM36 Fan + Light Canopy (Blue)"],
      ],
      zha: [
        ["vzm31-sn", "VZM31-SN 2-1 (Blue)"], ["vzm32-sn", "VZM32-SN mmWave 2-1 (Blue)"],
        ["vzm35-sn", "VZM35-SN Fan Switch (Blue)"], ["vzm36", "VZM36 Fan + Light Canopy (Blue)"],
      ],
      matter: [
        ["vtm31-sn", "VTM31-SN 2-1 (White)"], ["vtm35-sn", "VTM35-SN Fan Switch (White)"],
      ],
    };

    RED.nodes.registerType("inovelli-led-manager", {
      category: "inovelli",
      color: "#B68181",
      defaults: {
        name: { value: "" },
        integration: { value: "zwave_js" },
        model: { value: "vzw31-sn" },
        entityid: { value: "" },
        basetopic: { value: "zigbee2mqtt" },
        devicename: { value: "" },
        ieee: { value: "" },
        mattercolor: { value: "" },
        matterintensityon: { value: "" },
        matterintensityoff: { value: "" },
        color: { value: 170 },
        colorOff: { value: 170 },
        brightness: { value: 33 },
        brightnessOff: { value: 1 },
        fanColor: { value: 170 },
        fanBrightness: { value: 33 },
        fanBrightnessOff: { value: 1 },
        toggleColor: { value: false },
        toggleColorOff: { value: false },
        toggleBrightness: { value: false },
        toggleBrightnessOff: { value: false },
        toggleFanColor: { value: false },
        toggleFanBrightness: { value: false },
        toggleFanBrightnessOff: { value: false },
      },
      inputs: 1,
      outputs: 1,
      outputLabels: "Connect to a Home Assistant action node",
      icon: "light.svg",
      align: "right",
      label: function () { return this.name || "inovelli-led-manager"; },
      oneditprepare: function () {
        const self = this;

        function refreshModels() {
          const integration = $("#node-input-integration").val();
          const $model = $("#node-input-model").empty();
          MODELS[integration].forEach(([id, label]) => $model.append(new Option(label, id)));
          $model.val(MODELS[integration].some(([id]) => id === self.model) ? self.model : MODELS[integration][0][0]);
          refreshVisibility();
          refreshRows();
        }
        function refreshVisibility() {
          const integration = $("#node-input-integration").val();
          $(".row-zwave").toggle(integration === "zwave_js");
          $(".row-z2m").toggle(integration === "zigbee2mqtt");
          $(".row-zha").toggle(integration === "zha");
          $(".row-matter").toggle(integration === "matter");
        }
        function refreshRows() {
          const model = $("#node-input-model").val() || "";
          $(".row-coloroff").toggle(model.startsWith("vzw") || model.startsWith("vzm"));
          $(".row-fan").toggle(model === "lzw36" || model === "vzm36");
          // Color rows stay visible for every integration (matter snaps the color).
          const max = model.startsWith("lzw") ? 10 : 100;
          $(".level-slider").attr("max", max);
        }
        function bindOutput(inputId, outputId) {
          $("#" + inputId).on("input change", function () { $("#" + outputId).text(this.value); });
        }

        $("#node-input-integration").on("change", refreshModels);
        $("#node-input-model").on("change", refreshRows);
        bindOutput("node-input-color", "colorOutput");
        bindOutput("node-input-colorOff", "colorOffOutput");
        bindOutput("node-input-brightness", "brightnessOutput");
        bindOutput("node-input-brightnessOff", "brightnessOffOutput");
        bindOutput("node-input-fanColor", "fanColorOutput");
        bindOutput("node-input-fanBrightness", "fanBrightnessOutput");
        bindOutput("node-input-fanBrightnessOff", "fanBrightnessOffOutput");
        refreshModels();
      },
    });
  })();
</script>

<script type="text/x-red" data-help-name="inovelli-led-manager">
    <p>This node constructs the message for configuring the persistent LED bar (color and brightness, on and off) of an Inovelli Red (Z-Wave), Blue (Zigbee), or White (Matter) series switch. The output should be connected directly to a Home Assistant action node (<code>msg.payload = { action, target?, data }</code>).</p>
    <p>Each color/brightness field is only sent if its checkbox is checked <em>or</em> the matching key is present on <code>msg.payload</code> — leaving a field unchecked and absent from the payload leaves that setting untouched on the device. At least one field must be active or the node errors.</p>
    <dl class="message-properties">
        <dt>Integration<span class="property-type">string</span></dt>
        <dd>Which Home Assistant integration controls the device: <code>zwave_js</code>, <code>zigbee2mqtt</code>, <code>zha</code>, or <code>matter</code>. Determines which of the fields below are shown/used.</dd>

        <dt>Model<span class="property-type">string</span></dt>
        <dd>The Inovelli switch model. The list is filtered to models supported by the selected Integration.</dd>

        <dt>Entity ID(s)<span class="property-type">string</span></dt>
        <dd>(Z-Wave JS only) Entity ID, or a comma-delimited list of entity IDs, to target.</dd>

        <dt>Base Topic<span class="property-type">string</span></dt>
        <dd>(Zigbee2MQTT only) The MQTT base topic configured for your Zigbee2MQTT bridge (default <code>zigbee2mqtt</code>).</dd>

        <dt>Device Name<span class="property-type">string</span></dt>
        <dd>(Zigbee2MQTT only) The friendly name of the device as known to Zigbee2MQTT.</dd>

        <dt>IEEE Address<span class="property-type">string</span></dt>
        <dd>(ZHA only) The IEEE address of the device to target.</dd>

        <dt>LED Color Select Entity<span class="property-type">string</span></dt>
        <dd>(Matter only) The <code>select</code> entity used to choose the LED bar color.</dd>

        <dt>LED Intensity (On) Number Entity<span class="property-type">string</span></dt>
        <dd>(Matter only) The <code>number</code> entity used to set LED bar brightness when the load is on.</dd>

        <dt>LED Intensity (Off) Number Entity<span class="property-type">string</span></dt>
        <dd>(Matter only) The <code>number</code> entity used to set LED bar brightness when the load is off.</dd>

        <dt>Color When On<span class="property-type">number|string|array</span></dt>
        <dd>LED bar color while the load is on (accepts color names, RGB arrays, hex, and 0-360&deg; hue values; 361=white).</dd>

        <dt>Color When Off<span class="property-type">number|string|array</span></dt>
        <dd>LED bar color while the load is off. Only shown for VZW/VZM models (legacy LZW switches share one color; Matter has no separate off color).</dd>

        <dt>Brightness When On<span class="property-type">number</span></dt>
        <dd>LED bar brightness while the load is on. 0-100 for VZW/VZM/VTM models, 0-10 for legacy LZW models.</dd>

        <dt>Brightness When Off<span class="property-type">number</span></dt>
        <dd>LED bar brightness while the load is off. Same range as above.</dd>

        <dt>Fan Color<span class="property-type">number|string|array</span></dt>
        <dd>(LZW36/VZM36 only) LED bar color for the fan load.</dd>

        <dt>Fan Brightness When On<span class="property-type">number</span></dt>
        <dd>(LZW36/VZM36 only) LED bar brightness for the fan load while it is on.</dd>

        <dt>Fan Brightness When Off<span class="property-type">number</span></dt>
        <dd>(LZW36/VZM36 only) LED bar brightness for the fan load while it is off.</dd>
    </dl>
    <p>
      Any value configured on this node can be overridden per-message by setting the matching key on <code>msg.payload</code>. Setting a payload key activates that field even if its checkbox is unchecked. Recognized override keys: <code>integration</code> (alias <code>zwave</code>), <code>model</code> (alias <code>switchtype</code>), <code>entity_id</code>, <code>topic</code>, <code>device</code>, <code>ieee</code>, <code>color_entity</code>, <code>intensity_on_entity</code>, <code>intensity_off_entity</code>, <code>color</code>, <code>colorOff</code>, <code>brightness</code>, <code>brightnessOff</code>, <code>fanColor</code>, <code>fanBrightness</code>, <code>fanBrightnessOff</code>. For example:
      <pre>
msg = {
  payload: {
    integration: "zigbee2mqtt",
    topic: "zigbee2mqtt",
    device: "Office Switch",
    color: "blue",
    brightness: 100
  }
}

or

msg = {
  payload: {
    integration: "matter",
    color_entity: "select.office_led_color",
    intensity_on_entity: "number.office_led_intensity_on",
    color: 180,
    brightness: 34
  }
}
      </pre>
    </p>
</script>
